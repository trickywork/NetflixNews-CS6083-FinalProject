<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Netflix News System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <span class="logo">NETFLIX NEWS</span>
            </div>
            <h1 class="auth-title">Sign Up</h1>
            
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username" required minlength="3">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required minlength="6">
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                </div>
                <div class="form-group">
                    <input type="text" id="fullName" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="text" id="fullAddress" class="form-control" placeholder="Full Address" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        // Redirect if already logged in
        if (TokenManager.getToken()) {
            window.location.href = '/index.html';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                Toast.error('Passwords do not match');
                return;
            }
            
            const data = {
                username: document.getElementById('username').value,
                password: password,
                fullName: document.getElementById('fullName').value,
                fullAddress: document.getElementById('fullAddress').value,
                monthlyServiceCharge: 9.99
            };
            
            Loading.show();
            
            try {
                const result = await AuthAPI.register(data);
                
                if (result.code === 200) {
                    Toast.success('Registration successful! Please sign in.');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1000);
                } else {
                    Toast.error(result.message || 'Registration failed');
                }
            } catch (error) {
                Toast.error('An error occurred. Please try again.');
            } finally {
                Loading.hide();
            }
        });
    </script>
</body>
</html>
