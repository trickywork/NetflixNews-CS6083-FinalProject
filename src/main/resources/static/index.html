<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix News System</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/echarts.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/index.html" class="logo">NETFLIX NEWS</a>
        <ul class="nav-links" id="nav-links">
            <li><a href="/index.html" class="active">Home</a></li>
            <li><a href="/web-series.html">Web Series</a></li>
            <li><a href="/schedules.html">Schedules</a></li>
            <li><a href="/feedback.html">Feedback</a></li>
        </ul>
        <div class="nav-user" id="nav-user"></div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Stats Section -->
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-series">-</div>
                    <div class="stat-label">Web Series</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-accounts">-</div>
                    <div class="stat-label">Accounts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-contracts">-</div>
                    <div class="stat-label">Contracts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-feedback">-</div>
                    <div class="stat-label">Reviews</div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="grid-2">
                <div class="chart-container">
                    <div class="chart-title">Viewers by Genre</div>
                    <div id="viewersChart" style="height: 300px;"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">Rating Distribution</div>
                    <div id="ratingChart" style="height: 300px;"></div>
                </div>
            </div>

            <!-- Top Rated Series -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Top Rated Web Series</h3>
                    <a href="/web-series.html" class="btn btn-outline btn-sm">View All</a>
                </div>
                <div class="series-grid" id="top-rated-grid"></div>
            </div>

            <!-- Recent Feedback -->
            <div class="card" style="margin-top: 20px;">
                <div class="card-header">
                    <h3 class="card-title">Recent Reviews</h3>
                    <a href="/feedback.html" class="btn btn-outline btn-sm">View All</a>
                </div>
                <div id="recent-feedback"></div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script>
        // Load dashboard data
        async function loadDashboard() {
            try {
                // Load statistics
                const statsResult = await StatisticsAPI.getDashboard();
                if (statsResult.code === 200) {
                    const stats = statsResult.data;
                    document.getElementById('stat-series').textContent = Format.number(stats.totalWebSeries);
                    document.getElementById('stat-accounts').textContent = Format.number(stats.totalAccounts);
                    document.getElementById('stat-contracts').textContent = Format.number(stats.totalContracts);
                    document.getElementById('stat-feedback').textContent = Format.number(stats.totalFeedback);
                }

                // Load charts
                loadViewersChart();
                loadRatingChart();

                // Load top rated series
                loadTopRated();

                // Load recent feedback
                loadRecentFeedback();
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Viewers by Genre Chart
        async function loadViewersChart() {
            const result = await StatisticsAPI.getViewersByType();
            if (result.code === 200 && result.data) {
                const chartDom = document.getElementById('viewersChart');
                const myChart = echarts.init(chartDom);
                
                const data = result.data.map(item => ({
                    name: item.type,
                    value: item.viewers
                }));

                const option = {
                    tooltip: {
                        trigger: 'item',
                        formatter: '{b}: {c} ({d}%)'
                    },
                    legend: {
                        orient: 'vertical',
                        left: 'left',
                        textStyle: { color: '#e5e5e5' }
                    },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 10,
                            borderColor: '#141414',
                            borderWidth: 2
                        },
                        label: {
                            show: false,
                            position: 'center'
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 20,
                                fontWeight: 'bold',
                                color: '#fff'
                            }
                        },
                        labelLine: { show: false },
                        data: data
                    }],
                    color: ['#E50914', '#46d369', '#f5c518', '#17a2b8', '#6f42c1', '#fd7e14', '#20c997', '#e83e8c']
                };

                myChart.setOption(option);
                window.addEventListener('resize', () => myChart.resize());
            }
        }

        // Rating Distribution Chart
        async function loadRatingChart() {
            const result = await StatisticsAPI.getRatingDistribution();
            if (result.code === 200 && result.data) {
                const chartDom = document.getElementById('ratingChart');
                const myChart = echarts.init(chartDom);
                
                const xData = result.data.map(item => item.rating + ' Star');
                const yData = result.data.map(item => item.count);

                const option = {
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: { type: 'shadow' }
                    },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        axisLabel: { color: '#e5e5e5' },
                        axisLine: { lineStyle: { color: '#404040' } }
                    },
                    yAxis: {
                        type: 'value',
                        axisLabel: { color: '#e5e5e5' },
                        axisLine: { lineStyle: { color: '#404040' } },
                        splitLine: { lineStyle: { color: '#333' } }
                    },
                    series: [{
                        data: yData,
                        type: 'bar',
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#E50914' },
                                { offset: 1, color: '#B20710' }
                            ]),
                            borderRadius: [4, 4, 0, 0]
                        }
                    }]
                };

                myChart.setOption(option);
                window.addEventListener('resize', () => myChart.resize());
            }
        }

        // Load Top Rated Series
        async function loadTopRated() {
            const result = await WebSeriesAPI.getTopRated(4);
            if (result.code === 200 && result.data) {
                const container = document.getElementById('top-rated-grid');
                container.innerHTML = result.data.map(series => `
                    <div class="series-card" onclick="window.location.href='/web-series-detail.html?id=${series.webSeriesId}'">
                        <div class="series-poster">🎬</div>
                        <div class="series-info">
                            <h3 class="series-title">${series.name}</h3>
                            <div class="series-meta">
                                <span>${series.numberOfEpisodes} Episodes</span>
                                <span>${series.originalLanguage}</span>
                            </div>
                            <span class="series-type">${series.type}</span>
                            ${series.averageRating ? `
                                <div class="series-rating">
                                    <span>★</span>
                                    <span>${series.averageRating.toFixed(1)}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            }
        }

        // Load Recent Feedback
        async function loadRecentFeedback() {
            const result = await FeedbackAPI.getRecent(5);
            if (result.code === 200 && result.data) {
                const container = document.getElementById('recent-feedback');
                if (result.data.length === 0) {
                    container.innerHTML = '<p style="padding: 20px; color: #757575;">No reviews yet.</p>';
                    return;
                }
                container.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Web Series</th>
                                <th>Rating</th>
                                <th>Comment</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${result.data.map(fb => `
                                <tr>
                                    <td>${fb.accountName || 'Anonymous'}</td>
                                    <td>${fb.webSeriesName}</td>
                                    <td style="color: #f5c518;">${'★'.repeat(fb.rating)}${'☆'.repeat(5-fb.rating)}</td>
                                    <td>${Format.truncate(fb.feedbackText || '-', 40)}</td>
                                    <td>${Format.date(fb.feedbackDate)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
