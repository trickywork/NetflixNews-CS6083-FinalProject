# Netflix News System Configuration
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/netflix_news?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    druid:
      # Connection pool settings
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # Connection timeout and recycling
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # Monitor configuration
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: netflix.news.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:LocalDevelopmentOnlyJwtSecretKeyForNetflixNewsSystemChangeMe}
  expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours in milliseconds
  header: Authorization
  prefix: Bearer 

# Logging Configuration
logging:
  level:
    netflix.news.system: DEBUG
    org.springframework.security: DEBUG
